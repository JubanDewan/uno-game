<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO Online</title>
<style>
:root{color-scheme:light dark;--bg:#eef0f3;--fg:#15171a;--pn:#fff;--mut:#6b717b;--ln:#d5d9e0;--R:#e5383b;--Y:#f5b700;--G:#27a05b;--B:#2f6fdb}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#eceef2;--pn:#1f2227;--mut:#99a0ab;--ln:#323740}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:56px;margin:8vh 0 4px;letter-spacing:-2px;font-weight:900}
h1 span:nth-child(1){color:var(--R)}h1 span:nth-child(2){color:var(--Y)}h1 span:nth-child(3){color:var(--G)}
input,button{font:inherit;border-radius:10px;border:1px solid var(--ln);padding:12px 14px;background:var(--pn);color:var(--fg)}
input{width:100%}
button{cursor:pointer;font-weight:600}
button.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--B);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.mut{color:var(--mut);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.code{font:800 40px/1 ui-monospace,Menlo,monospace;letter-spacing:6px}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.list li{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pc{background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.pc.t{border-color:var(--fg)}
.pc b{background:var(--fg);color:var(--bg);border-radius:6px;padding:0 7px}
.pc em{color:var(--R);font-weight:800;font-style:normal}
.table{display:flex;justify-content:center;align-items:center;gap:22px;padding:18px 0}
.c{width:58px;height:86px;border-radius:9px;border:3px solid #fff;display:grid;place-items:center;color:#fff;font:800 24px system-ui;box-shadow:0 1px 4px #0005;flex:none;user-select:none}
.c i{font-style:normal;text-shadow:0 1px 2px #0006}
.c.R{background:var(--R)}.c.Y{background:var(--Y);color:#222}.c.Y i{text-shadow:none}.c.G{background:var(--G)}.c.B{background:var(--B)}
.c.W{background:conic-gradient(var(--R) 0 25%,var(--B) 0 50%,var(--G) 0 75%,var(--Y) 0)}
.c.back{background:#202226;font-size:15px;color:#fff;cursor:default}
.c.big{width:76px;height:112px;font-size:32px}
.c.go{cursor:pointer;outline:3px solid var(--Y);outline-offset:3px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:14px 0}
.hand .c{transition:transform .12s}
.hand .on{cursor:pointer;transform:translateY(-8px)}
.hand .off{opacity:.4}
.st{text-align:center;font-weight:600;min-height:24px}
.log{text-align:center;color:var(--mut);font-size:14px;min-height:20px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px}
.ov>div{background:var(--pn);border-radius:16px;padding:24px;text-align:center;max-width:340px;width:100%}
.cp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cp button{height:64px;border:0;color:#fff}.cp button[data-c=Y]{color:#222}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.s{opacity:1}

:root{--cw:58px;--ch:86px;--rs:min(64vw,38vh,280px)}
@media(orientation:landscape) and (max-height:520px){:root{--cw:44px;--ch:65px}}
@media(min-width:900px) and (min-height:700px){:root{--cw:70px;--ch:104px}}
.c{width:var(--cw);height:var(--ch);font-size:calc(var(--cw)*.42);position:relative}
.c.big{width:calc(var(--cw)*1.3);height:calc(var(--ch)*1.3);font-size:calc(var(--cw)*.55)}
.c.back{background:#1b1c20;overflow:hidden;font-size:calc(var(--cw)*.42)}
.c.back i{display:none}
.c.back::before{content:'UNO';position:absolute;left:-10%;right:-10%;top:30%;bottom:30%;background:var(--R);border-radius:50%;transform:rotate(-24deg);display:grid;place-items:center;color:var(--Y);font:900 .5em/1 system-ui}
.c.mini{width:calc(var(--cw)*.55);height:calc(var(--ch)*.55);font-size:calc(var(--cw)*.3);border-width:2px;border-radius:6px}
#app.g{max-width:1100px;padding:8px}
.gm{height:calc(100vh - 16px);height:calc(100dvh - 16px);display:flex;flex-direction:column;gap:4px}
.gm .bar{margin:0}
.seats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;padding:6px 0 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px}
.tag{display:flex;gap:6px;align-items:center;background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;max-width:150px}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag b{background:var(--fg);color:var(--bg);border-radius:5px;padding:0 6px}
.tag em{color:var(--R);font-style:normal;font-weight:800}
.seat.t>.tag,.me.t .tag{background:var(--Y);border-color:var(--Y);color:#222}
.fan{display:flex;justify-content:center;padding-top:2px}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.piles{position:relative;display:flex;align-items:center;gap:calc(var(--cw)*.6)}
.pile{text-align:center;font-size:12px;color:var(--mut)}
.ringw{position:absolute;left:50%;top:50%;width:var(--rs);height:var(--rs);margin:calc(var(--rs)/-2) 0 0 calc(var(--rs)/-2);pointer-events:none}
.ring{width:100%;height:100%;color:var(--Y);opacity:.5;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.me{padding-bottom:max(4px,env(safe-area-inset-bottom))}
.mehead{display:flex;justify-content:center;gap:8px;align-items:center}
.hand{flex-wrap:nowrap;gap:0;padding:18px 8px 6px;overflow-x:auto;justify-content:safe center;scrollbar-width:none}
.hand .c:hover{z-index:2}
.ov{z-index:40}
@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,setDoc,onSnapshot,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDF5n9QLR136niB935lG8ThtkI0lgfzaVY",authDomain:"game-5d4ed.firebaseapp.com",projectId:"game-5d4ed",storageBucket:"game-5d4ed.firebasestorage.app",messagingSenderId:"817751327735",appId:"1:817751327735:web:fa1a24d4f232e62f7ae4f2",measurementId:"G-CD48QGV9TZ"});
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const db=getFirestore(app),auth=getAuth(app);

const $=s=>document.querySelector(s);
const st={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
let pid=null,authErr=null,ct; // pid = uid Firebase Auth (anonim), diisi setelah login berhasil
let room=null,S=null,unsub=null,pick=null,lastRect=null,tt;
const COL={R:'Merah',Y:'Kuning',G:'Hijau',B:'Biru'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)};

/* ===== Aturan permainan ===== */
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
// Kartu: warna(R/Y/G/B/W)+nilai(0-9, S=skip, R=reverse, D=+2, W=wild, F=+4)
const mkDeck=()=>{const d=[];for(const c of'RYGB'){d.push(c+'0');for(let i=1;i<10;i++)d.push(c+i,c+i);for(const v of'SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('WW','WF');return shuffle(d)};
const lab=c=>({S:'⊘',R:'⇄',D:'+2',W:'W',F:'+4'}[c.slice(1)]||c.slice(1));
const nm=(c,col)=>c[0]==='W'?(c==='WF'?'+4':'Wild')+' ('+COL[col]+')':COL[c[0]]+' '+lab(c);
const top=s=>s.discard[s.discard.length-1];
const ok=(s,c)=>c[0]==='W'||c[0]===s.color||c.slice(1)===top(s).slice(1);
const adv=(s,k=1)=>{const n=s.players.length;s.turn=((s.turn+s.dir*k)%n+n)%n;s.drew=false};
function take(s,p,k){for(let i=0;i<k;i++){if(!s.draw.length){const t=s.discard.pop();s.draw=shuffle(s.discard);s.discard=[t]}if(s.draw.length)p.hand.push(s.draw.pop())}}
function eff(s,c){
  const n=s.players.length,v=c.slice(1),nx=()=>s.players[((s.turn+s.dir)%n+n)%n];
  if(c==='WF'){take(s,nx(),4);adv(s,2)}
  else if(v==='D'){take(s,nx(),2);adv(s,2)}
  else if(v==='S')adv(s,2);
  else if(v==='R'){s.dir*=-1;adv(s,n==2?0:1)} // 2 pemain: reverse = main lagi
  else adv(s)
}
function deal(s){
  if(s.host!==pid)throw'Hanya host yang bisa memulai';
  if(s.players.length<2)throw'Minimal 2 pemain';
  s.draw=mkDeck();s.dir=1;s.drew=false;s.winner=null;s.log='Permainan dimulai!';
  s.players.forEach(p=>{p.hand=[];take(s,p,7)});
  let c;do{c=s.draw.pop();if(c==='WF')s.draw.unshift(c)}while(c==='WF');
  s.discard=[c];s.color=c[0]==='W'?'RYGB'[Math.random()*4|0]:c[0];
  s.turn=s.players.length-1;eff(s,c);s.status='playing'
}
function play(s,i,col){
  const p=s.players[s.turn],c=p.hand[i];
  if(s.status!=='playing'||p.id!==pid||!c)throw'Bukan giliranmu';
  if(s.drew&&i!==p.hand.length-1)throw'Hanya kartu yang baru diambil yang boleh dimainkan';
  if(!ok(s,c))throw'Kartu tidak cocok';
  p.hand.splice(i,1);s.discard.push(c);s.color=c[0]==='W'?col:c[0];
  s.log=p.name+' memainkan '+nm(c,s.color);
  if(!p.hand.length){s.status='finished';s.winner=p.name;return}
  eff(s,c)
}
function drawCard(s){
  const p=s.players[s.turn];
  if(s.status!=='playing'||p.id!==pid||s.drew)throw'Tidak bisa mengambil kartu';
  if(p.hand.some(c=>ok(s,c)))throw'Kamu masih punya kartu yang cocok';
  const n=p.hand.length;take(s,p,1);s.log=p.name+' mengambil kartu';
  if(p.hand.length>n&&ok(s,p.hand[n]))s.drew=true;else adv(s)
}

/* ===== Firebase ===== */
async function act(fn,code=room){
  try{
    await runTransaction(db,async t=>{
      const ref=doc(db,'rooms',code),sn=await t.get(ref);
      if(!sn.exists())throw'Room tidak ditemukan';
      const s=sn.data();if(fn(s)!==false)t.set(ref,s)
    });return true
  }catch(e){toast(typeof e==='string'?e:'Gagal: '+(e.code||e.message));sfx('err');return false}
}
function enter(code){
  room=code;st.set('room',code);unsub&&unsub();
  unsub=onSnapshot(doc(db,'rooms',code),sn=>{const prev=S;S=sn.exists()?sn.data():null;
    if(!S||!S.players.some(p=>p.id===pid)){detach();toast('Room tidak tersedia')}else{render();fx(prev,S)}},
    e=>{detach();toast('Firestore error: '+e.code)})
}
function detach(){unsub&&unsub();unsub=null;room=null;S=null;pick=null;st.set('room',null);render()}
const myName=()=>{if(!pid){toast('Menghubungkan ke server…');return null}const n=$('#name').value.trim();if(!n){toast('Isi namamu dulu');return null}st.set('name',n);return n};

const A=window.A={
  async create(){
    const name=myName();if(!name)return;
    const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
    try{await setDoc(doc(db,'rooms',code),{host:pid,status:'lobby',pids:[pid],players:[{id:pid,name,hand:[]}],draw:[],discard:[],turn:0,dir:1,color:'R',drew:false,log:'',winner:null});enter(code)}
    catch(e){toast('Gagal membuat room: '+(e.code||e.message))}
  },
  async join(){
    const name=myName();if(!name)return;
    const code=$('#code').value.trim().toUpperCase();if(code.length!==4)return toast('Kode room terdiri dari 4 huruf');
    const done=await act(s=>{
      if(s.pids.includes(pid))return false;
      if(s.status!=='lobby')throw'Permainan sudah dimulai';
      if(s.players.length>=10)throw'Room penuh (maks. 10 pemain)';
      s.players.push({id:pid,name,hand:[]});s.pids.push(pid)
    },code);
    if(done)enter(code)
  },
  start:()=>act(deal),
  async leave(){
    if(S&&S.status==='lobby')await act(s=>{s.players=s.players.filter(p=>p.id!==pid);s.pids=s.pids.filter(i=>i!==pid);if(s.host===pid&&s.players.length)s.host=s.players[0].id});
    detach()
  },
  tap(i,ev){lastRect=ev&&ev.currentTarget.getBoundingClientRect();const c=S.players[S.turn].hand[i];if(c[0]==='W'){if(!ok(S,c))return;pick=i;render()}else act(s=>play(s,i))},
  col(c){const i=pick;pick=null;render();act(s=>play(s,i,c))},
  cancel(){pick=null;render()},
  draw:()=>act(drawCard),
  snd(){mute=!mute;st.set('mute',mute?'1':'0');render();sfx('turn')},
  pass:()=>act(s=>{if(!s.drew||s.players[s.turn].id!==pid)throw'Tidak bisa melewati';adv(s)}),
  again:()=>act(s=>{if(s.host!==pid)throw'Hanya host';s.status='lobby';s.players.forEach(p=>p.hand=[])})
};

/* ===== Suara (sintesis WebAudio, tanpa file) ===== */
let AC,mute=st.get('mute')==='1';
const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch{}return AC};
function tone(f,d,type='sine',g=.12,to=0,at=0){const x=ac();if(!x||mute)return;const t=x.currentTime+at,o=x.createOscillator(),v=x.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(x.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,g=.15,hp=2000){const x=ac();if(!x||mute)return;const n=x.sampleRate*d|0,b=x.createBuffer(1,n,x.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const o=x.createBufferSource(),f=x.createBiquadFilter(),v=x.createGain();o.buffer=b;f.type='highpass';f.frequency.value=hp;v.gain.value=g;o.connect(f);f.connect(v);v.connect(x.destination);o.start()}
const seq=(fs,d,type,g,gap)=>fs.forEach((f,i)=>tone(f,d,type,g,0,i*gap));
const SFX={
  play:()=>{noise(.09,.18);tone(220,.08,'triangle',.12,120)},
  draw:()=>{noise(.12,.1,1500);tone(300,.1,'sine',.08,520)},
  skip:()=>{tone(520,.08,'square',.06);tone(390,.12,'square',.06,0,.09)},
  rev:()=>tone(300,.28,'sawtooth',.05,900),
  plus:()=>{tone(140,.25,'sawtooth',.09,90);tone(180,.25,'square',.04,110,.05)},
  wild:()=>seq([392,523,659,784],.12,'triangle',.09,.06),
  turn:()=>{tone(660,.12,'sine',.12);tone(880,.2,'sine',.12,0,.11)},
  uno:()=>seq([523,659,784,1047],.14,'square',.05,.07),
  start:()=>seq([262,330,392,523],.15,'triangle',.1,.08),
  win:()=>seq([523,659,784,1047,784,1047,1319],.2,'triangle',.12,.12),
  lose:()=>seq([392,349,311,262],.25,'sawtooth',.06,.18),
  err:()=>tone(150,.2,'square',.07)
};
const sfx=k=>{try{SFX[k]()}catch{}};
addEventListener('pointerdown',()=>ac(),{once:true});

/* ===== Animasi kartu ===== */
const rect=q=>{const e=document.querySelector(q);return e&&e.getBoundingClientRect()};
const cwv=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw'))||58;
function fly(from,to,html,delay,after){
  if(!from||!to){after&&after();return}
  const w=document.createElement('div');w.innerHTML=html;const c=w.firstChild;
  c.style.cssText+=`;position:fixed;left:${to.left}px;top:${to.top}px;width:${to.width}px;height:${to.height}px;margin:0;z-index:50;pointer-events:none;font-size:${to.width*.42}px`;
  document.body.appendChild(c);
  const dx=from.left+from.width/2-to.left-to.width/2,dy=from.top+from.height/2-to.top-to.height/2;
  c.animate([{transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width}) rotate(-12deg)`},{transform:'none'}],{duration:420,delay,easing:'cubic-bezier(.2,.8,.25,1)',fill:'backwards'}).onfinish=()=>{c.remove();after&&after()}
}
function fx(a,b){ // bandingkan state lama & baru: animasi + suara
  if(!a||!b)return;
  if(a.status!=='playing'){b.status==='playing'&&sfx('start');return}
  const me=b.players.findIndex(p=>p.id===pid),ap=a.turn;
  if(b.discard.length>a.discard.length){
    const c=b.discard[b.discard.length-1],t=$('#disc .c'),v=c.slice(1);
    const from=ap===me&&lastRect?lastRect:rect(`.seat[data-p="${ap}"]`);lastRect=null;
    if(t){t.style.visibility='hidden';fly(from,t.getBoundingClientRect(),card(c,b.color,'big'),0,()=>t.style.visibility='')}
    sfx('play');const k=c==='WF'||v==='D'?'plus':{S:'skip',R:'rev',W:'wild'}[v];k&&setTimeout(sfx,150,k)
  }
  b.players.forEach((p,i)=>{
    const o=a.players[i],g=o?p.hand.length-o.hand.length:0;
    if(g>0){
      sfx('draw');
      for(let k=0;k<g;k++){
        if(i===me){const idx=p.hand.length-g+k,t=document.querySelector(`.hand [data-i="${idx}"]`);
          if(t){t.style.visibility='hidden';fly(rect('#dp'),t.getBoundingClientRect(),card(p.hand[idx],''),k*120,()=>t.style.visibility='')}}
        else{const f=rect(`.seat[data-p="${i}"] .fan`),w=cwv()*.55;
          f&&fly(rect('#dp'),{left:f.left+f.width/2-w/2,top:f.top,width:w,height:w*1.5},'<div class="c back mini"></div>',k*120)}
      }
    }
    if(o&&p.hand.length===1&&o.hand.length>1)setTimeout(sfx,350,'uno')
  });
  if(b.status==='finished')setTimeout(sfx,400,b.winner===b.players[me].name?'win':'lose');
  else if(b.turn===me&&a.turn!==me)setTimeout(sfx,350,'turn')
}
addEventListener('resize',()=>{if(room&&S)render()});

/* ===== Tampilan ===== */
const card=(c,col,cls='',at='')=>`<div class="c ${c[0]==='W'&&!col?'W':col||c[0]} ${cls}" ${at}><i>${lab(c)}</i></div>`;
function render(){
  const el=$('#app');el.className=(room&&S&&S.status!=='lobby')?'g':'';
  if(!room||!S){
    el.innerHTML=`<h1><span>U</span><span>N</span><span>O</span></h1>
    <p class="mut">Main bareng 2–10 orang secara realtime. Habiskan kartumu lebih dulu.</p>
    <div class="col"><input id="name" placeholder="Namamu" maxlength="14" value="${esc(st.get('name')||'')}" autocomplete="off">
    <button class="p need" onclick="A.create()">Buat room baru</button>
    <div class="row"><input id="code" placeholder="Kode room" maxlength="4" autocapitalize="characters" autocomplete="off"><button class="need" onclick="A.join()">Gabung</button></div><div id="stat" class="mut"></div></div>`;stat();
    return
  }
  const bar=`<div class="bar"><span class="mut">Room <b>${room}</b></span><span class="row"><button onclick="A.snd()" aria-label="Suara">${mute?'🔇':'🔊'}</button><button onclick="A.leave()">Keluar</button></span></div>`;
  if(S.status==='lobby'){
