<script type="module">
const CFG={apiKey:"AIzaSyDF5n9QLR136niB935lG8ThtkI0lgfzaVY",authDomain:"game-5d4ed.firebaseapp.com",projectId:"game-5d4ed",storageBucket:"game-5d4ed.firebasestorage.app",messagingSenderId:"817751327735",appId:"1:817751327735:web:fa1a24d4f232e62f7ae4f2",measurementId:"G-CD48QGV9TZ"};
let initializeApp,getFirestore,doc,setDoc,onSnapshot,runTransaction,deleteDoc,getAuth,signInAnonymously,db,auth;

const $=s=>document.querySelector(s);
const st={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
let pid=null,authErr=null,ct,sdkMsg='Memuat Firebase…',sdkErr=''; // pid = uid Firebase Auth (anonim), diisi setelah login berhasil
let room=null,S=null,unsub=null,pick=null,lastRect=null,tt,delT=null,gone=false;
const COL={R:'Merah',Y:'Kuning',G:'Hijau',B:'Biru'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)};

/* ===== Aturan permainan ===== */
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
// Kartu: warna(R/Y/G/B/W)+nilai(0-9, S=skip, R=reverse, D=+2, W=wild, F=+4)
const mkDeck=()=>{const d=[];for(const c of'RYGB'){d.push(c+'0');for(let i=1;i<10;i++)d.push(c+i,c+i);for(const v of'SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('WW','WF');return shuffle(d)};
const lab=c=>({S:'⊘',R:'⇄',D:'+2',W:'W',F:'+4'}[c.slice(1)]||c.slice(1));
const nm=(c,col)=>c[0]==='W'?(c==='WF'?'+4':'Wild')+' ('+COL[col]+')':COL[c[0]]+' '+lab(c);
const top=s=>s.discard[s.discard.length-1];
const ok=(s,c)=>c[0]==='W'||c[0]===s.color||c.slice(1)===top(s).slice(1);
const step=s=>{const n=s.players.length;do{s.turn=((s.turn+s.dir)%n+n)%n}while(!s.players[s.turn].hand.length)}; // lompat ke pemain berikutnya yang masih punya kartu
const adv=(s,k=1)=>{for(let i=0;i<k;i++)step(s);s.drew=false};
const nxt=s=>{const n=s.players.length;let i=s.turn;do{i=((i+s.dir)%n+n)%n}while(!s.players[i].hand.length);return s.players[i]};
function take(s,p,k){for(let i=0;i<k;i++){if(!s.draw.length){const t=s.discard.pop();s.draw=shuffle(s.discard);s.discard=[t]}if(s.draw.length)p.hand.push(s.draw.pop())}}
function eff(s,c){
  const v=c.slice(1),na=s.players.filter(p=>p.hand.length).length;
  if(c==='WF'){take(s,nxt(s),4);adv(s,2)}
  else if(v==='D'){take(s,nxt(s),2);adv(s,2)}
  else if(v==='S')adv(s,2);
  else if(v==='R'){s.dir*=-1;adv(s,na==2&&s.players[s.turn].hand.length?0:1)} // tersisa 2 pemain: reverse = main lagi
  else adv(s)
}
function deal(s){
  if(s.host!==pid)throw'Hanya host yang bisa memulai';
  if(s.players.length<2)throw'Minimal 2 pemain';
  s.draw=mkDeck();s.dir=1;s.drew=false;s.winner=null;s.log='Permainan dimulai!';
  s.players.forEach(p=>{p.hand=[];p.rank=0;take(s,p,7)});
  let c;do{c=s.draw.pop();if(c==='WF')s.draw.unshift(c)}while(c==='WF');
  s.discard=[c];s.color=c[0]==='W'?'RYGB'[Math.random()*4|0]:c[0];
  const n=s.players.length;s.turn=((Math.random()*n|0)+n-1)%n;eff(s,c);s.status='playing'; // pemain pertama acak
  s.log='Permainan dimulai! '+s.players[s.turn].name+' jalan pertama'
}
function play(s,i,col){
  const p=s.players[s.turn],c=p.hand[i];
  if(s.status!=='playing'||p.id!==pid||!c)throw'Bukan giliranmu';
  if(s.drew&&i!==p.hand.length-1)throw'Hanya kartu yang baru diambil yang boleh dimainkan';
  if(!ok(s,c))throw'Kartu tidak cocok';
  p.hand.splice(i,1);s.discard.push(c);s.color=c[0]==='W'?col:c[0];
  s.log=p.name+' memainkan '+nm(c,s.color);
  if(!p.hand.length){ // pemain ini habis kartu: dapat peringkat, permainan lanjut sampai tersisa 1 pemain
    p.rank=s.players.filter(q=>q.rank>0).length+1;s.log+=' dan selesai di peringkat '+p.rank+'!';
    const rest=s.players.filter(q=>q.hand.length);
    if(rest.length<=1){if(rest[0])rest[0].rank=s.players.length;s.status='finished';s.winner=p.name;return} // winner = pemain yang mengakhiri permainan (tetap sesuai rules); juara = rank 1
  }
  eff(s,c)
}
function drawCard(s){
  const p=s.players[s.turn];
  if(s.status!=='playing'||p.id!==pid||s.drew)throw'Tidak bisa mengambil kartu';
  if(p.hand.some(c=>ok(s,c)))throw'Kamu masih punya kartu yang cocok';
  const n=p.hand.length;take(s,p,1);s.log=p.name+' mengambil kartu';
  if(p.hand.length>n&&ok(s,p.hand[n]))s.drew=true;else adv(s)
}

/* ===== Firebase ===== */
async function act(fn,code=room){
  try{
    await runTransaction(db,async t=>{
      const ref=doc(db,'rooms',code),sn=await t.get(ref);
      if(!sn.exists())throw'Room tidak ditemukan';
      const s=sn.data();if(fn(s)!==false)t.set(ref,s)
    });return true
  }catch(e){toast(typeof e==='string'?e:'Gagal: '+(e.code||e.message));sfx('err');return false}
}
const delRoom=async c=>{try{await deleteDoc(doc(db,'rooms',c))}catch(e){/* sudah dihapus pemain lain */}};
function enter(code){
  room=code;gone=false;clearTimeout(delT);delT=null;st.set('room',code);unsub&&unsub();
  unsub=onSnapshot(doc(db,'rooms',code),sn=>{
    const prev=S;
    if(!sn.exists()){
      if(prev&&prev.status==='finished'){unsub&&unsub();unsub=null;clearTimeout(delT);gone=true;st.set('room',null);render();return} // room dihapus setelah selesai: hasil tetap tampil dari salinan lokal
      detach();toast('Room tidak tersedia');return
    }
    S=sn.data();
    if(!S.players.some(p=>p.id===pid)){detach();toast('Room tidak tersedia');return}
    render();fx(prev,S);
    if(S.status==='finished'&&!delT){const i=S.players.findIndex(p=>p.id===pid);delT=setTimeout(()=>delRoom(code),6000+i*2500)} // hapus otomatis; urutan pemain mencegah semua menghapus bersamaan
  },e=>{detach();toast('Firestore error: '+e.code)})
}
function detach(){unsub&&unsub();unsub=null;clearTimeout(delT);delT=null;gone=false;room=null;S=null;pick=null;st.set('room',null);render()}
const myName=()=>{if(!pid){toast('Menghubungkan ke server…');return null}const n=$('#name').value.trim();if(!n){toast('Isi namamu dulu');return null}st.set('name',n);return n};

const A=window.A={
  async create(){
    const name=myName();if(!name)return;
    const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
    try{await setDoc(doc(db,'rooms',code),{host:pid,status:'lobby',pids:[pid],players:[{id:pid,name,hand:[]}],draw:[],discard:[],turn:0,dir:1,color:'R',drew:false,log:'',winner:null});enter(code)}
    catch(e){toast('Gagal membuat room: '+(e.code||e.message))}
  },
  async join(){
    const name=myName();if(!name)return;
    const code=$('#code').value.trim().toUpperCase();if(code.length!==4)return toast('Kode room terdiri dari 4 huruf');
    const done=await act(s=>{
      if(s.pids.includes(pid))return false;
      if(s.status!=='lobby')throw'Permainan sudah dimulai';
      if(s.players.length>=10)throw'Room penuh (maks. 10 pemain)';
      s.players.push({id:pid,name,hand:[]});s.pids.push(pid)
    },code);
    if(done)enter(code)
  },
  start:()=>act(deal),
  async leave(){
    const code=room;let empty=false;
    if(S&&S.status==='lobby')await act(s=>{s.players=s.players.filter(p=>p.id!==pid);s.pids=s.pids.filter(i=>i!==pid);if(s.host===pid&&s.players.length)s.host=s.players[0].id;empty=!s.players.length});
    else if(S&&S.status==='finished'&&!gone)delRoom(code);
    if(empty)delRoom(code); // room kosong ikut dihapus
    detach()
  },
  tap(i,ev){lastRect=ev&&ev.currentTarget.getBoundingClientRect();const c=S.players[S.turn].hand[i];if(c[0]==='W'){if(!ok(S,c))return;pick=i;render()}else act(s=>play(s,i))},
  col(c){const i=pick;pick=null;render();act(s=>play(s,i,c))},
  cancel(){pick=null;render()},
  draw:()=>act(drawCard),
  snd(){mute=!mute;st.set('mute',mute?'1':'0');render();sfx('turn')},
  pass:()=>act(s=>{if(!s.drew||s.players[s.turn].id!==pid)throw'Tidak bisa melewati';adv(s)}),
  again:()=>act(s=>{if(s.host!==pid)throw'Hanya host';s.status='lobby';s.players.forEach(p=>p.hand=[])})
};

/* ===== Suara (sintesis WebAudio, tanpa file) ===== */
let AC,mute=st.get('mute')==='1';
const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch{}return AC};
function tone(f,d,type='sine',g=.12,to=0,at=0){const x=ac();if(!x||mute)return;const t=x.currentTime+at,o=x.createOscillator(),v=x.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(x.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,g=.15,hp=2000){const x=ac();if(!x||mute)return;const n=x.sampleRate*d|0,b=x.createBuffer(1,n,x.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const o=x.createBufferSource(),f=x.createBiquadFilter(),v=x.createGain();o.buffer=b;f.type='highpass';f.frequency.value=hp;v.gain.value=g;o.connect(f);f.connect(v);v.connect(x.destination);o.start()}
const seq=(fs,d,type,g,gap)=>fs.forEach((f,i)=>tone(f,d,type,g,0,i*gap));
const SFX={
  play:()=>{noise(.09,.18);tone(220,.08,'triangle',.12,120)},
  draw:()=>{noise(.12,.1,1500);tone(300,.1,'sine',.08,520)},
  skip:()=>{tone(520,.08,'square',.06);tone(390,.12,'square',.06,0,.09)},
  rev:()=>tone(300,.28,'sawtooth',.05,900),
  plus:()=>{tone(140,.25,'sawtooth',.09,90);tone(180,.25,'square',.04,110,.05)},
  wild:()=>seq([392,523,659,784],.12,'triangle',.09,.06),
  turn:()=>{tone(660,.12,'sine',.12);tone(880,.2,'sine',.12,0,.11)},
  uno:()=>seq([523,659,784,1047],.14,'square',.05,.07),
  start:()=>seq([262,330,392,523],.15,'triangle',.1,.08),
  win:()=>seq([523,659,784,1047,784,1047,1319],.2,'triangle',.12,.12),
  lose:()=>seq([392,349,311,262],.25,'sawtooth',.06,.18),
  err:()=>tone(150,.2,'square',.07)
};
const sfx=k=>{try{SFX[k]()}catch{}};
addEventListener('pointerdown',()=>ac(),{once:true});

/* ===== Animasi kartu ===== */
const rect=q=>{const e=document.querySelector(q);return e&&e.getBoundingClientRect()};
const cwv=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw'))||58;
function fly(from,to,html,delay,after){
  if(!from||!to){after&&after();return}
  const w=document.createElement('div');w.innerHTML=html;const c=w.firstChild;
  c.style.cssText+=`;position:fixed;left:${to.left}px;top:${to.top}px;width:${to.width}px;height:${to.height}px;margin:0;z-index:50;pointer-events:none;font-size:${to.width*.42}px`;
  document.body.appendChild(c);
  const dx=from.left+from.width/2-to.left-to.width/2,dy=from.top+from.height/2-to.top-to.height/2;
  c.animate([{transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width}) rotate(-12deg)`},{transform:'none'}],{duration:420,delay,easing:'cubic-bezier(.2,.8,.25,1)',fill:'backwards'}).onfinish=()=>{c.remove();after&&after()}
}
function fx(a,b){ // bandingkan state lama & baru: animasi + suara
  if(!a||!b)return;
  if(a.status!=='playing'){b.status==='playing'&&sfx('start');return}
  const me=b.players.findIndex(p=>p.id===pid),ap=a.turn;
  if(b.discard.length>a.discard.length){
    const c=b.discard[b.discard.length-1],t=$('#disc .c'),v=c.slice(1);
    const from=ap===me&&lastRect?lastRect:rect(`.seat[data-p="${ap}"]`);lastRect=null;
    if(t){t.style.visibility='hidden';fly(from,t.getBoundingClientRect(),card(c,b.color,'big'),0,()=>t.style.visibility='')}
    sfx('play');const k=c==='WF'||v==='D'?'plus':{S:'skip',R:'rev',W:'wild'}[v];k&&setTimeout(sfx,150,k)
  }
  b.players.forEach((p,i)=>{
    const o=a.players[i],g=o?p.hand.length-o.hand.length:0;
    if(g>0){
      sfx('draw');
      for(let k=0;k<g;k++){
        if(i===me){const idx=p.hand.length-g+k,t=document.querySelector(`.hand [data-i="${idx}"]`);
          if(t){t.style.visibility='hidden';fly(rect('#dp'),t.getBoundingClientRect(),card(p.hand[idx],''),k*120,()=>t.style.visibility='')}}
        else{const f=rect(`.seat[data-p="${i}"] .fan`),w=cwv()*.55;
          f&&fly(rect('#dp'),{left:f.left+f.width/2-w/2,top:f.top,width:w,height:w*1.5},'<div class="c back mini"></div>',k*120)}
      }
    }
    if(o&&p.hand.length===1&&o.hand.length>1)setTimeout(sfx,350,'uno')
  });
  const mp=b.players[me],mo=a.players[me];
  if(b.players.some((p,i)=>i!==me&&!p.hand.length&&a.players[i]&&a.players[i].hand.length))setTimeout(sfx,300,'wild');
  if(b.status==='finished')setTimeout(sfx,500,mp.rank===b.players.length?'lose':'win');
  else if(!mp.hand.length&&mo.hand.length)setTimeout(sfx,500,'win');
  else if(b.turn===me&&a.turn!==me)setTimeout(sfx,350,'turn')
}
addEventListener('resize',()=>{if(room&&S)render()});

/* ===== Tampilan ===== */
const card=(c,col,cls='',at='')=>`<div class="c ${c[0]==='W'&&!col?'W':col||c[0]} ${cls}" ${at}><i>${lab(c)}</i></div>`;
function render(){
  const el=$('#app');el.className=(room&&S&&S.status!=='lobby')?'g':'';
  if(!room||!S){
    el.innerHTML=`<h1><span>U</span><span>N</span><span>O</span></h1>
    <p class="mut">Main bareng 2–10 orang secara realtime. Habiskan kartumu lebih dulu.</p>
    <div class="col"><input id="name" placeholder="Namamu" maxlength="14" value="${esc(st.get('name')||'')}" autocomplete="off">
    <button class="p need" onclick="A.create()">Buat room baru</button>
    <div class="row"><input id="code" placeholder="Kode room" maxlength="4" autocapitalize="characters" autocomplete="off"><button class="need" onclick="A.join()">Gabung</button></div><div id="stat" class="mut"></div><div class="mut" style="font-size:12px">uno v7</div></div>`;stat();
    return
  }
  const bar=`<div class="bar"><span class="mut">Room <b>${room}</b></span><span class="row"><button onclick="A.snd()" aria-label="Suara">${mute?'🔇':'🔊'}</button><button onclick="A.leave()">Keluar</button></span></div>`;
  if(S.status==='lobby'){
    const host=S.host===pid;
    el.innerHTML=`${bar}<div class="col"><div class="code">${room}</div>
    <p class="mut">Bagikan kode ini ke teman-temanmu. Pemain: ${S.players.length}/10</p>
    <ul class="list">${S.players.map(p=>`<li><span>${esc(p.name)}${p.id===pid?' (kamu)':''}</span>${p.id===S.host?'<span class="mut">host</span>':''}</li>`).join('')}</ul>
    ${host?`<button class="p" onclick="A.start()" ${S.players.length<2?'disabled':''}>${S.players.length<2?'Tunggu minimal 2 pemain':'Mulai permainan'}</button>`:'<p class="mut">Menunggu host memulai…</p>'}</div>`;
    return
  }
  const meI=S.players.findIndex(p=>p.id===pid),me=S.players[meI],cur=S.players[S.turn],play=S.status==='playing',mine=play&&cur.id===pid,n=me.hand.length;
  const last=n-1,can=i=>mine&&ok(S,me.hand[i])&&(!S.drew||i===last),any=me.hand.some((_,i)=>can(i)),canDraw=mine&&!S.drew&&!any;
  const msg=!play?'':mine?(S.drew?'Mainkan kartu yang baru diambil, atau lewati':any?'Giliranmu — pilih kartu':'Tidak ada kartu cocok — ketuk tumpukan untuk mengambil'):'Giliran '+esc(cur.name);
  const cw=cwv(),gap=6,mg=n>1?Math.max(gap-Math.max(0,(n*cw+(n-1)*gap-(innerWidth-52))/(n-1)),-cw*.6):0;
  const order=me.hand.map((c,i)=>[c,i]).sort((a,b)=>a[0]<b[0]?-1:1);
  const tot=S.players.length,m=tot-1,opp=Array.from({length:m},(_,k)=>(meI+1+k)%tot);
  const seat=(i,k)=>{const p=S.players[i],t=m>1?k/(m-1)*2-1:0,c=p.hand.length,f=Math.min(c,7);
    return `<div class="seat ${play&&i===S.turn?'t':''} ${play&&!c?'done':''}" data-p="${i}" style="transform:rotate(${(t*9).toFixed(1)}deg) translateY(${(t*t*14).toFixed(0)}px)"><div class="tag"><span>${esc(p.name)}</span><b>${play&&!c?'#'+p.rank:c}</b>${c===1?'<em>UNO!</em>':''}</div><div class="fan">${Array.from({length:f},(_,j)=>`<div class="c back mini" style="margin-left:${j?'calc(var(--cw)*-.36)':0};transform:rotate(${((j-(f-1)/2)*7).toFixed(1)}deg)"></div>`).join('')}</div></div>`};
  const ring=`<div class="ringw" style="transform:scaleX(${S.dir})"><svg class="ring" style="animation-delay:-${((Date.now()/1000)%8).toFixed(2)}s" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs><path d="M16 30A40 40 0 0 1 84 30" marker-end="url(#ah)"/><path d="M84 70A40 40 0 0 1 16 70" marker-end="url(#ah)"/></svg></div>`;
  el.innerHTML=`<div class="gm">${bar}
  <div class="seats">${opp.map(seat).join('')}</div>
  <div class="mid"><div class="piles">${ring}
    <div class="pile"><div id="dp" class="c back big ${canDraw?'go':''}" ${canDraw?'onclick="A.draw()" role="button" tabindex="0"':''}></div>${S.draw.length}</div>
    <div id="disc">${card(top(S),S.color,'big')}</div></div>
    <div class="log">${esc(S.log)}</div><div class="st">${msg}</div></div>
  <div class="me ${mine?'t':''}"><div class="mehead"><div class="tag"><span>${esc(me.name)} (kamu)</span><b>${play&&!n?'#'+me.rank:n}</b>${n===1?'<em>UNO!</em>':''}</div>${mine&&S.drew?'<button onclick="A.pass()">Lewati</button>':''}</div>
  ${play&&!n?`<div class="spec">Kamu selesai di peringkat #${me.rank}.<br>Kamu menonton sampai permainan berakhir.</div>`:''}<div class="hand">${order.map(([c,i],k)=>card(c,'',mine?(can(i)?'on':'off'):'',`data-i="${i}" style="margin-left:${k?mg:0}px"${can(i)?` onclick="A.tap(${i},event)"`:''}`)).join('')}</div></div></div>
  ${pick!==null?`<div class="ov"><div><b>Pilih warna</b><div class="cp">${['R','Y','G','B'].map(c=>`<button data-c="${c}" style="background:var(--${c})" onclick="A.col('${c}')">${COL[c]}</button>`).join('')}</div><p><button onclick="A.cancel()">Batal</button></p></div></div>`:''}
  ${S.status==='finished'?`<div class="ov"><div><h2 style="margin:0 0 6px">${me.rank===1?'Kamu juara 1!':me.rank===tot?'Kamu kalah':'Kamu peringkat #'+me.rank}</h2><p class="mut" style="margin:0 0 8px">Permainan selesai — hanya tersisa 1 pemain.</p>
    <ol class="rk">${[...S.players].sort((x,y)=>x.rank-y.rank).map(x=>`<li><b>${x.rank}</b><span>${esc(x.name)}${x.id===pid?' (kamu)':''}</span>${x.rank===tot?'<em class="mut">kalah</em>':''}</li>`).join('')}</ol>
    <p class="mut" style="font-size:13px;margin:0 0 12px">${gone?'Data room sudah dihapus dari server.':'Data room akan dihapus otomatis dari server.'}</p><button class="p" onclick="A.leave()">Keluar</button></div></div>`:''}`
}
render();window.__ok=1;
const HINT={'sdk':'Library Firebase tidak bisa diunduh. Coba ganti jaringan (Wi-Fi ⇄ data seluler), matikan VPN atau pemblokir iklan, lalu coba lagi.','auth/admin-restricted-operation':'Login anonim belum diizinkan. Aktifkan Anonymous di Authentication → Sign-in method, lalu cek Settings → User actions → Enable create (sign-up).','auth/operation-not-allowed':'Aktifkan Anonymous di Firebase Console → Authentication → Sign-in method.','auth/network-request-failed':'Tidak bisa menjangkau Firebase. Cek internet, dan buka file lewat server atau hosting, bukan pratinjau chat.','timeout':'Firebase tidak merespons. Cek internet, dan buka file lewat server atau hosting, bukan pratinjau chat.'};
function stat(){
  const e=$('#stat');if(!e)return;
  e.innerHTML=pid?'':authErr?`<span style="color:var(--R)">${authErr==='sdk'?'Firebase gagal dimuat.':'Gagal login ('+esc(authErr)+').'}</span> ${esc(HINT[authErr]||'Periksa konfigurasi Firebase.')}${authErr==='sdk'?'<br><small>'+esc(sdkErr)+'</small><br>':''} <button onclick="A.retry()">Coba lagi</button>`:esc(sdkMsg);
  document.querySelectorAll('.need').forEach(b=>b.disabled=!pid)
}
const SRC=[n=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${n}.js`,n=>`https://cdn.jsdelivr.net/npm/firebase@10.12.2/${n}/+esm`,n=>`https://esm.sh/firebase@10.12.2/${n}`];
async function loadSDK(){
  const errs=[],T=u=>Promise.race([import(u),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout 8 dtk')),8000))]);
  for(const f of SRC){
    const host=new URL(f('app')).host;sdkMsg='Memuat Firebase dari '+host+'…';stat();
    try{
      const[A1,F1,U1]=await Promise.all([T(f('app')),T(f('firestore')),T(f('auth'))]);
      ({initializeApp}=A1);({getFirestore,doc,setDoc,onSnapshot,runTransaction,deleteDoc}=F1);({getAuth,signInAnonymously}=U1);
      const app=initializeApp(CFG);db=getFirestore(app);auth=getAuth(app);return
    }catch(e){errs.push(host+': '+(e&&e.message||e))}
  }
  throw new Error(errs.join(' | '))
}
async function connect(){
  authErr=null;stat();clearTimeout(ct);
  if(!db){try{await loadSDK()}catch(e){authErr='sdk';sdkErr=e.message;stat();return}}
  sdkMsg='Menghubungkan ke server…';stat();
  ct=setTimeout(()=>{if(!pid&&!authErr){authErr='timeout';stat()}},10000);
  signInAnonymously(auth).then(u=>{pid=u.user.uid;authErr=null;stat();const r=st.get('room');if(r)enter(r)}).catch(e=>{authErr=e.code||e.message;stat()})
}
A.retry=connect;connect();
</script>
