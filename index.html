<style>
:root{color-scheme:light dark;--bg:#eef0f3;--fg:#15171a;--pn:#fff;--mut:#6b717b;--ln:#d5d9e0;--R:#e5383b;--Y:#f5b700;--G:#27a05b;--B:#2f6fdb}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:56px;margin:8vh 0 4px;letter-spacing:-2px;font-weight:900}

input,button{font:inherit;border-radius:10px;border:1px solid var(--ln);padding:12px 14px;background:var(--pn);color:var(--fg)}
input{width:100%}
button{cursor:pointer;font-weight:600}
button.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--B);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.mut{color:var(--mut);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.code{font:800 40px/1 ui-monospace,Menlo,monospace;letter-spacing:6px}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.list li{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.c{width:58px;height:86px;border-radius:9px;border:3px solid #fff;display:grid;place-items:center;color:#fff;font:800 24px system-ui;box-shadow:0 1px 4px #0005;flex:none;user-select:none}

.c.R{background:var(--R)}.c.Y{background:var(--Y);color:#222}.c.Y i{text-shadow:none}.c.G{background:var(--G)}.c.B{background:var(--B)}
.c.W{background:conic-gradient(var(--R) 0 25%,var(--B) 0 50%,var(--G) 0 75%,var(--Y) 0)}
.c.back{background:#202226;font-size:15px;color:#fff;cursor:default}
.c.big{width:76px;height:112px;font-size:32px}
.c.go{cursor:pointer;outline:3px solid var(--Y);outline-offset:3px}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:14px 0}
.hand .c{transition:transform .12s}
.hand .on{cursor:pointer;transform:translateY(-8px)}
.hand .off{opacity:1;filter:saturate(.45) brightness(.72)}
.st{text-align:center;font-weight:600;min-height:24px}
.log{text-align:center;color:var(--mut);font-size:14px;min-height:20px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px}
.ov>div{background:var(--pn);border-radius:16px;padding:24px;text-align:center;max-width:340px;width:100%}
.cp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cp button{height:64px;border:0;color:#fff}.cp button[data-c=Y]{color:#222}

:root{--cw:58px;--ch:86px;--rs:min(64vw,38vh,280px)}

.c{width:var(--cw);height:var(--ch);font-size:calc(var(--cw)*.42);position:relative}
.c.big{width:calc(var(--cw)*var(--k,1.3));height:calc(var(--ch)*var(--k,1.3));font-size:calc(var(--cw)*.55)}

.c.back::before{content:'UNO';position:absolute;left:-10%;right:-10%;top:30%;bottom:30%;background:var(--R);border-radius:50%;transform:rotate(-24deg);display:grid;place-items:center;color:var(--Y);font:900 .5em/1 system-ui}
.c.mini{width:calc(var(--cw)*.55);height:calc(var(--ch)*.55);font-size:calc(var(--cw)*.3);border-width:2px;border-radius:6px}
#app.g{max-width:1100px;padding:8px}
.gm{height:calc(100vh - 16px);height:calc(100dvh - 16px);display:flex;flex-direction:column;gap:4px}
.gm .bar{margin:0}
.seats{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;padding:6px 0 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px}
.tag{display:flex;gap:6px;align-items:center;background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;max-width:150px}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tag em{color:var(--R);font-style:normal;font-weight:800}
.seat.t>.tag,.me.t .tag{background:var(--Y);border-color:var(--Y);color:#222}
.fan{display:flex;justify-content:center;padding-top:2px}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.piles{position:relative;display:flex;align-items:center;gap:calc(var(--cw)*.6)}
.pile{text-align:center;font-size:12px;color:var(--mut)}
.ringw{position:absolute;left:50%;top:50%;width:var(--rs);height:var(--rs);margin:calc(var(--rs)/-2) 0 0 calc(var(--rs)/-2);pointer-events:none}
.ring{width:100%;height:100%;color:var(--Y);opacity:.5;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.me{padding-bottom:max(4px,env(safe-area-inset-bottom))}
.mehead{display:flex;justify-content:center;gap:8px;align-items:center}
.hand{flex-wrap:nowrap;gap:0;padding:38px 16px 10px;margin-top:-24px;pointer-events:none;overflow-x:auto;justify-content:safe center;scrollbar-width:none}
.hand .c{pointer-events:auto}
.hand .c:hover{z-index:2}
.ov{z-index:40}
@media(orientation:landscape) and (max-height:520px){
:root{--k:1.1;--rs:min(44vh,190px)}
.gm{gap:0}.gm .bar button{padding:4px 10px}
.seats{padding:2px 0 8px}.log{display:none}.mid{gap:2px}.st{font-size:13px}
.me{position:relative}.mehead{position:absolute;left:6px;bottom:10px;flex-direction:column;align-items:flex-start;z-index:3}
}
.hand .on{transition:transform .16s cubic-bezier(.2,.9,.3,1.5),box-shadow .16s}
.hand .on:hover{transform:translateY(-20px) scale(1.1) rotate(-2deg);box-shadow:0 10px 18px #0006;z-index:3}
.hand .on:active{transform:translateY(-6px) scale(.93);transition-duration:.06s;box-shadow:0 2px 6px #0006}
.c.go{transition:transform .16s cubic-bezier(.2,.9,.3,1.5)}
.c.go:hover{transform:translateY(-4px) scale(1.07)}
.c.go:active{transform:scale(.93);transition-duration:.06s}
.seat.done{opacity:.5}
.spec{text-align:center;color:var(--mut);padding:26px 12px 18px;font-size:14px}
.rk{list-style:none;padding:0;margin:0 0 14px;text-align:left}
.rk li{display:flex;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--ln)}
.rk li b{width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px}
.rk li span{flex:1}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-style:normal;font-weight:800;flex:none}
.who{display:flex;gap:10px;align-items:center;margin:2px 0 6px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pnl .ov{z-index:70}#toast{z-index:100}
.ov>.pn{text-align:left;max-width:440px;max-height:86vh;overflow:auto;padding:16px}
.pn .bar{margin-bottom:10px}.pn label{display:block;margin:10px 0 4px}.pn h4{margin:16px 0 6px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}
.lbl{list-style:none;padding:0;margin:0}
.lbl li{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--ln)}
.lbl li>b:first-child{width:22px;text-align:center;color:var(--mut)}
.lbl li span{flex:1;display:flex;flex-direction:column;min-width:0}
.lbl li.you{background:color-mix(in srgb,var(--Y) 22%,transparent);border-radius:8px}
.lbl em{font-style:normal;text-align:right;font-weight:700}
.cols{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}.sw.sel{border-color:var(--fg)}
[hidden]{display:none!important}
body{background:var(--bgi,var(--bg));background-attachment:fixed}
button{transition:transform .15s,box-shadow .15s,background-color .15s}

button:not(:disabled):active{transform:translateY(0) scale(.96);box-shadow:none}
.c{border:4px solid #fff;border-radius:11px;font-weight:900}
.c s{position:absolute;left:7%;right:7%;top:19%;bottom:19%;background:#fff;border-radius:50%;transform:rotate(-28deg)}
.c i{position:relative;z-index:1;font-size:1.55em;line-height:1;text-shadow:none}
.c.R i{color:var(--R)}.c.Y i{color:#e0a400}.c.G i{color:var(--G)}.c.B i{color:var(--B)}
.c u{position:absolute;top:2px;left:4px;font:800 .5em/1 system-ui;text-decoration:none;color:#fff}
.c u.b{top:auto;left:auto;bottom:2px;right:4px;transform:rotate(180deg)}
.c.Y u{color:#222}
.c.W{background:#14161a}
.c.W s{left:50%;right:auto;width:62%;top:50%;bottom:auto;aspect-ratio:1;transform:translate(-50%,-50%);background:conic-gradient(var(--R) 0 25%,var(--B) 0 50%,var(--G) 0 75%,var(--Y) 0)}
.c.W i{color:#fff;font-size:1.05em;text-shadow:0 1px 3px #000c}
.hero{display:flex;justify-content:center;padding:26px 0 40px;--cw:50px;--ch:74px}
.hero .c{margin-left:-14px;transform:rotate(var(--r)) translateY(var(--y));transform-origin:50% 120%;transition:transform .2s}
.hero .c:first-child{margin-left:0}
.hero .c:hover{transform:rotate(var(--r)) translateY(calc(var(--y) - 14px)) scale(1.08);z-index:2}
.top{display:flex;justify-content:space-between;align-items:center}
.ib{width:42px;height:42px;padding:0;font-size:18px}
.navl{display:flex;gap:8px;flex-wrap:wrap;max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .2s,margin .25s}
.navl.open{max-height:120px;opacity:1;margin:8px 0}
.dot{background:var(--R);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:6px}
.cm{height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.msg{max-width:80%;padding:7px 11px;border-radius:14px;background:var(--bg);border:1px solid var(--ln);align-self:flex-start;word-break:break-word}
.msg.out{align-self:flex-end;background:var(--B);color:#fff;border-color:transparent}
.ths{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.th{height:56px;padding:0 0 4px;border:3px solid transparent;font-size:11px;font-weight:700;color:#222;display:grid;place-items:end center}
.th.d{color:#eee}.th.sel{border-color:var(--fg)}
#ntf{position:fixed;left:50%;top:12px;transform:translate(-50%,-160%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:92vw;box-shadow:0 8px 24px #0005;cursor:pointer;opacity:0;pointer-events:none;transition:transform .25s,opacity .2s,filter .15s;z-index:110}

#ntf:hover{filter:brightness(1.18)}
.ib{position:relative}
.ib .dot{position:absolute;top:-6px;right:-6px;margin:0;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;font-size:10px;line-height:1}
.msg small{display:block;font-size:11px;font-weight:700;margin-bottom:1px}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.c.dr{cursor:pointer;transition:transform .16s cubic-bezier(.2,.9,.3,1.5)}

:root{--ol:#232a4a;--navh:76px}

const mkDeck=()=>{const d=[];for(const c of'RYGB'){d.push(c+'0');for(let i=1;i<10;i++)d.push(c+i,c+i);for(const v of'SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('WW','WF');return shuffle(d)};

const adv=(s,k=1)=>{for(let i=0;i<k;i++)step(s);s.drew=false};

function take(s,p,k){for(let i=0;i<k;i++){if(!s.draw.length){const t=s.discard.pop();s.draw=shuffle(s.discard);s.discard=[t]}if(s.draw.length)p.hand.push(s.draw.pop())}}

  async saveP(){

    if(!un&&old)return err('Username tidak bisa dikosongkan, hanya bisa diganti');
    e.style.color='';e.textContent='Menyimpan…';
    try{
      if(un&&un!==old){ // klaim username baru, lepas yang lama (satu transaksi)

const updSpeak=()=>document.querySelectorAll('[data-u]').forEach(e=>e.classList.toggle('spk',speakers.has(e.dataset.u)));
function updPeers(){vPeers=new Set(vRoom?[...vRoom.remoteParticipants.values()].map(p=>p.identity):[]);if(vOn)vPeers.add(pid);if(room&&S)render()}
function voiceCleanup(){vRoom=null;vOn=false;vMuted=false;vBusy=false;speakers=new Set();vPeers=new Set();const c=$('#vc');if(c)c.innerHTML='';updVoice();updSpeak()}
function voiceLeave(){vSess++;const r=vRoom;vRoom=null;if(r){try{r.disconnect()}catch{}}voiceCleanup()}
async function voiceJoin(){
  if(vBusy||vOn||!room||!S)return; // voice hanya bisa dipakai setelah room dibuat/dimasuki
  if(!VOICE_API){toast('Voice belum disiapkan: isi VOICE_API di index.html (lihat voice-worker.js)');return}
  const my=++vSess,code=room;vBusy=true;updVoice();
  try{
    const[lk,idt]=await Promise.all([loadLK(),auth.currentUser.getIdToken()]);
    const r=await fetch(VOICE_API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+idt},body:JSON.stringify({room:code})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Token ditolak ('+r.status+')');
    const rm=new lk.Room({audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}),E=lk.RoomEvent;
    rm.on(E.TrackSubscribed,t=>{if(t.kind==='audio')$('#vc').appendChild(t.attach())});
    rm.on(E.TrackUnsubscribed,t=>t.detach().forEach(e=>e.remove()));
    rm.on(E.ActiveSpeakersChanged,sp=>{speakers=new Set(sp.map(x=>x.identity));updSpeak()});
    rm.on(E.ParticipantConnected,updPeers);rm.on(E.ParticipantDisconnected,updPeers);
    rm.on(E.Disconnected,()=>{if(vRoom===rm){voiceCleanup();if(room&&S)render()}});
    await rm.connect(j.url,j.token);
    if(my!==vSess||room!==code){rm.disconnect();return}
    vRoom=rm;vOn=true;vMuted=false;
    await rm.startAudio().catch(()=>{});
    try{await rm.localParticipant.setMicrophoneEnabled(true)}catch(e){vMuted=true;toast('Mikrofon tidak bisa dipakai — kamu hanya mendengarkan')}
    updPeers()
  }catch(e){toast('Voice gagal: '+(e.message||e))}
  finally{if(my===vSess){vBusy=false;updVoice()}}
}
async function voiceMute(){
  if(!vRoom)return;
  try{await vRoom.localParticipant.setMicrophoneEnabled(vMuted);vMuted=!vMuted}catch(e){toast('Mikrofon tidak bisa dipakai')}
  updVoice()
}
Object.assign(A,{voice(){vOn?voiceMute():voiceJoin()},vleave(){voiceLeave()}});

/* ===== Salin / tempel kode room & dialog konfirmasi (CSS, bukan alert) ===== */
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,99);const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
function askConfirm({title,text,ok='Ya',cancel='Batal',icon='alert-circle',danger=false}){
  return new Promise(res=>{
    const d=$('#dlg');if(d.firstChild){res(false);return}
    const kd=e=>{if(e.key==='Escape')done(false)};
    const done=v=>{document.removeEventListener('keydown',kd);d.innerHTML='';res(v)};
    d.innerHTML=`<div class="dov" role="alertdialog" aria-modal="true" aria-labelledby="dlt"><div class="dbox ${danger?'dg':''}"><div class="dic">${ic(icon)}</div><h3 id="dlt">${esc(title)}</h3><p>${esc(text)}</p><div class="drow"><button id="dno">${esc(cancel)}</button><button id="dyes" class="${danger?'r':'p'}">${esc(ok)}</button></div></div></div>`;
    d.querySelector('#dno').onclick=()=>done(false);d.querySelector('#dyes').onclick=()=>done(true);
    d.querySelector('.dov').onclick=e=>{if(e.target.classList.contains('dov'))done(false)};
    document.addEventListener('keydown',kd);d.querySelector('#dno').focus()
  })
}
Object.assign(A,{
  async copy(b){
    if(!room)return;const ok=await copyText(room);
    if(!ok){toast('Gagal menyalin — catat kodenya: '+room);return}
    toast('Kode room '+room+' disalin');
    if(b&&!b.dataset.t){b.dataset.t='1';const h=b.innerHTML;b.innerHTML=ic('check')+' Tersalin';setTimeout(()=>{b.innerHTML=h;delete b.dataset.t},1600)}
  },
  async paste(){
    const inp=$('#code');if(!inp)return;let t='';
    try{t=await navigator.clipboard.readText()}catch(e){toast('Izin tempel ditolak — tekan lama pada kolom lalu pilih Tempel');inp.focus();return}
    t=(t||'').trim();
    const m=/^[A-Za-z]{4}$/.test(t)?t.toUpperCase():(t.match(/\b[A-Z]{4}\b/)||[])[0];
    if(!m){toast('Tidak ada kode room (4 huruf) di clipboard');return}
    inp.value=m;toast('Kode '+m+' ditempel')
  }
});

/* ===== Transisi Zoom-to-Reveal & animasi membagi kartu ===== */
const zoomOn=()=>C.get('zoom')!==0;
let zt=null,lastKind=null,dealState=0; // dealState: 0 tidak, 1 menunggu, 2 berjalan
const screenKind=()=>!room||!S?(!ready?'load':!AU?'login':!ME?'setup':'home'):S.status==='lobby'?'lobby':'game';
function render(){ // pergantian halaman memakai transisi; pembaruan di halaman yang sama langsung
  const k=screenKind();
  if(zt){zt.dirty=true;return}
  if(lastKind===null||k===lastKind||!zoomOn()){renderNow();lastKind=k;maybeDeal();return}
  zoomTo()
}
function zoomTo(){
  const el=$('#app'),ov=$('#zt'),f=ov.firstElementChild;zt={dirty:false};
  ov.style.display='grid';el.style.background='var(--bgi,var(--bg))';el.style.backgroundAttachment='fixed';
  let wd;
  const fin=()=>{clearTimeout(wd);el.getAnimations().forEach(a=>a.cancel());f.getAnimations().forEach(a=>a.cancel());
    el.style.background='';el.style.backgroundAttachment='';ov.style.display='none';const d=zt&&zt.dirty;zt=null;if(d){renderNow();lastKind=screenKind()}maybeDeal()};
  wd=setTimeout(()=>{try{renderNow();lastKind=screenKind()}catch(e){}fin()},4000);
  // 1) zoom-out: halaman lama menyusut ke titik fokus, kartu fokus muncul
  f.animate([{transform:'scale(.4)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.9,.3,1.4)',fill:'forwards'});
  el.animate([{clipPath:'circle(75% at 50% 50%)'},{clipPath:'circle(0% at 50% 50%)'}],{duration:260,easing:'cubic-bezier(.55,0,.85,.4)',fill:'forwards'}).finished.then(()=>{
    renderNow();lastKind=screenKind();zt.dirty=false; // halaman diganti saat tertutup
    setTimeout(()=>{ // 2) zoom-in: kartu fokus membesar, halaman baru terungkap dari titik tengah
      if(zt.dirty){renderNow();lastKind=screenKind();zt.dirty=false}
      f.getAnimations().forEach(a=>a.cancel());el.getAnimations().forEach(a=>a.cancel());
      f.animate([{transform:'scale(1)',opacity:1},{transform:'scale(16)',opacity:0}],{duration:560,easing:'cubic-bezier(.55,0,.9,.45)',fill:'forwards'});
      el.animate([{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}],{duration:560,easing:'cubic-bezier(.15,.75,.2,1)'}).finished.then(fin).catch(fin)
    },220)
  }).catch(fin)
}
function maybeDeal(){ // membagikan 7 kartu ke setiap pemain satu per satu dari tumpukan ambil
  if(dealState!==1||zt||screenKind()!=='game'||!S)return;
  const pile=rect('#dp'),np=S.players.length,w=cwv()*.5;
  if(!pile){dealState=0;renderNow();return}
  dealState=2;$('#app').classList.add('dealing','dealrun');
  document.querySelectorAll('.sx .cnt').forEach(e=>{if(!e.querySelector('.mdi'))e.textContent='0'});
  const per=7*np,gap=Math.max(28,Math.min(85,2200/per)),cnt=Array(np).fill(0);let landed=0,done=false;
  const end=()=>{if(done)return;done=true;finishDeal()};
  setTimeout(end,per*gap+1500);
  const target=i=>{const me=S.players[i].id===pid,r=me?rect('.hand'):rect(`.sx[data-p="${i}"] .sav`);if(!r)return null;
    const cx=r.left+r.width/2,cy=me?r.top+r.height*.72:r.top+r.height/2;return{left:cx-w/2,top:cy-w*.75,width:w,height:w*1.5}};
  for(let r=0;r<7;r++)for(let i=0;i<np;i++){
    const k=r*np+i;
    fly(pile,target(i),'<div class="c back mini"></div>',k*gap,()=>{landed++;const c=$(`.sx[data-p="${i}"] .cnt`);if(c)c.textContent=++cnt[i];if(k%3===0)sfx('draw');if(landed>=per)end()},320)
  }
}
function finishDeal(){
  dealState=0;const el=$('#app');if(!el||!S)return;
  el.classList.remove('dealing','dealrun');
  S.players.forEach((p,i)=>{const c=$(`.sx[data-p="${i}"] .cnt`);if(c&&!c.querySelector('.mdi')&&!p.rank)c.textContent=p.hand.length});
  document.querySelectorAll('.hand .c').forEach((e,k)=>{e.style.animation=`cpop .35s ${k*45}ms cubic-bezier(.2,.9,.3,1.5) backwards`;setTimeout(()=>{e.style.animation=''},900+k*45)});
  const t=$('#disc .c:last-child');if(t&&S.discard.length)throwCard(rect('#dp'),t,S.discard[S.discard.length-1],S.color); // kartu pembuka dibuka ke tumpukan buang
  sfx('play')
}

const HINT={'sdk':'Library Firebase tidak bisa diunduh. Coba ganti jaringan (Wi-Fi ⇄ data seluler), matikan VPN atau pemblokir iklan, lalu coba lagi.','auth/admin-restricted-operation':'Login anonim belum diizinkan. Aktifkan Anonymous di Authentication → Sign-in method, lalu cek Settings → User actions → Enable create (sign-up).','auth/operation-not-allowed':'Aktifkan Anonymous di Firebase Console → Authentication → Sign-in method.','auth/network-request-failed':'Tidak bisa menjangkau Firebase. Cek internet, dan buka file lewat server atau hosting, bukan pratinjau chat.','timeout':'Firebase tidak merespons. Cek internet, dan buka file lewat server atau hosting, bukan pratinjau chat.'};
function stat(){
  const e=$('#stat');if(!e)return;
  e.innerHTML=ready?'':authErr?`<span style="color:var(--R)">${authErr==='sdk'?'Firebase gagal dimuat.':'Gagal login ('+esc(authErr)+').'}</span> ${esc(HINT[authErr]||'Periksa konfigurasi Firebase.')}${authErr==='sdk'?'<br><small>'+esc(sdkErr)+'</small><br>':''} <button onclick="A.retry()">Coba lagi</button>`:esc(sdkMsg);
  document.querySelectorAll('.need').forEach(b=>b.disabled=!pid)
}
const SRC=[n=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${n}.js`,n=>`https://cdn.jsdelivr.net/npm/firebase@10.12.2/${n}/+esm`,n=>`https://esm.sh/firebase@10.12.2/${n}`];
async function loadSDK(){
  const errs=[],T=u=>Promise.race([import(u),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout 8 dtk')),8000))]);

      const app=initializeApp(CFG);db=getFirestore(app);auth=getAuth(app);return
    }catch(e){errs.push(host+': '+(e&&e.message||e))}
  }
  throw new Error(errs.join(' | '))
}
async function connect(){
  authErr=null;stat();
  if(!db){try{await loadSDK()}catch(e){authErr='sdk';sdkErr=e.message;stat();return}}
  sdkMsg='Memeriksa login…';stat();startAuth()
}
A.retry=connect;connect();
